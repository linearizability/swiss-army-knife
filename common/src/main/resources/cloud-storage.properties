## 云存储配置文件
# ========================
# 默认客户端配置（使用cloud-storage.前缀）
# provider类型：ali（阿里云OSS）、s3（AWS S3 / MinIO）
cloud-storage.provider=s3

# ========================
# 阿里云OSS配置示例
# ========================
#cloud-storage.provider=ali
#cloud-storage.endpoint=https://oss-cn-hangzhou.aliyuncs.com
#cloud-storage.accessKeyId=your-access-key-id
#cloud-storage.accessKeySecret=your-access-key-secret
#cloud-storage.bucketName=your-bucket-name
# 阿里云OSS不需要区域参数，从endpoint推断
#cloud-storage.region=

# ========================
# AWS S3配置示例
# ========================
#cloud-storage.provider=s3
#cloud-storage.endpoint=https://s3.amazonaws.com
#cloud-storage.accessKeyId=your-access-key-id
#cloud-storage.accessKeySecret=your-access-key-secret
#cloud-storage.bucketName=your-bucket-name
#cloud-storage.region=us-east-1
#cloud-storage.pathStyleAccess=false

# ========================
# MinIO配置示例
# ========================
#cloud-storage.provider=s3
#cloud-storage.endpoint=http://127.0.0.1:9000
#cloud-storage.accessKeyId=minioadmin
#cloud-storage.accessKeySecret=minioadmin
#cloud-storage.bucketName=your-bucket-name
#cloud-storage.region=us-east-1
# MinIO需要开启路径风格访问
#cloud-storage.pathStyleAccess=true

# ========================
# 多客户端配置示例（使用不同前缀）
# ========================
#cloud-storage.ali.provider=ali
#cloud-storage.ali.endpoint=https://oss-cn-hangzhou.aliyuncs.com
#cloud-storage.ali.accessKeyId=your-ali-key-id
#cloud-storage.ali.accessKeySecret=your-ali-key-secret
#cloud-storage.ali.bucketName=ali-bucket
#
#cloud-storage.minio.provider=s3
#cloud-storage.minio.endpoint=http://127.0.0.1:9000
#cloud-storage.minio.accessKeyId=minioadmin
#cloud-storage.minio.accessKeySecret=minioadmin
#cloud-storage.minio.bucketName=minio-bucket
#cloud-storage.minio.region=us-east-1
#cloud-storage.minio.pathStyleAccess=true